<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포착 성과 검증</title><style>body{background:#0b1220;color:#e9f1ff;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:20px}a{color:#9ed2ff}.muted{color:#a6b8d2}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.card{background:#19273d;border:1px solid #31455f;border-radius:12px;padding:16px}.big{font-size:25px;font-weight:700}select{background:#1a2b43;color:white;border:1px solid #4a617e;border-radius:8px;padding:10px}table{width:100%;border-collapse:collapse;min-width:750px}td,th{text-align:left;border-bottom:1px solid #33455f;padding:10px}th{color:#a9c4e5}.scroll{overflow:auto}</style></head><body><main><a href="index.html">← 포착기로 돌아가기</a><h1>자동 성과 검증</h1><p class="muted">15분 간격 스냅샷 기반 관찰 성과. 실제 기간 최고/최저가나 투자 수익률이 아니며 과거 가격을 소급 추정하지 않습니다.</p><label>레이더 <select id="radar"><option value="all">전체 (집계는 레이더별 분리)</option><option>NASDAQ 7.0</option><option>중국계 1.0</option></select></label> <label>기간 <select id="horizon"><option>15m</option><option>1h</option><option>1d</option><option>3d</option><option>5d</option></select></label><div id="cards" class="cards"></div><div class="scroll"><table><thead><tr><th>레이더</th><th>티커</th><th>포착 시각</th><th>기준가 ($)</th><th>관찰 최고 %</th><th>관찰 최저 %</th><th>+10% 관찰</th><th>표본수</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table></div><p id="updated" class="muted"></p></main><script>
let records=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const radar=document.getElementById('radar').value,h=document.getElementById('horizon').value;let rs=records.filter(x=>radar==='all'||x.radar===radar),done=rs.filter(x=>x.outcomes?.[h]?.complete&&x.outcomes[h].sample_count>=2),hit=done.filter(x=>x.outcomes[h].plus_10_observed);document.getElementById('cards').innerHTML=[['전체 기록',rs.length],['기준가 확인',rs.filter(x=>x.entry_price_usd!==null).length],['기간 완료·표본 2개+',done.length],['+10% 관찰 비율',done.length?(100*hit.length/done.length).toFixed(1)+'%':'검증 불가']].map(([k,v])=>'<div class="card"><div class="muted">'+k+'</div><div class="big">'+v+'</div></div>').join('');document.getElementById('rows').innerHTML=rs.slice().reverse().map(x=>{let o=x.outcomes?.[h];return '<tr><td>'+esc(x.radar)+'</td><td>'+esc(x.ticker)+'</td><td>'+esc(x.detected_utc)+'</td><td>'+esc(x.entry_price_usd??'미확인')+'</td><td>'+esc(o?.sampled_max_pct??'—')+'</td><td>'+esc(o?.sampled_min_pct??'—')+'</td><td>'+(!o?'—':o.plus_10_observed?'관찰':'미관찰')+'</td><td>'+esc(o?.sample_count??0)+'</td><td>'+esc(x.status)+'</td></tr>'}).join('');}
fetch('performance_results.json?cache='+Date.now()).then(r=>{if(!r.ok)throw Error('데이터 미생성');return r.json()}).then(d=>{records=Object.values(d.records||{});document.getElementById('updated').textContent='마지막 갱신: '+(d.updated_utc||'미확인')+' | +10% 미관찰은 상승이 없었다는 뜻이 아닙니다.';render()}).catch(e=>{document.getElementById('updated').textContent='성과 데이터 대기: '+e.message;render()});document.getElementById('radar').onchange=render;document.getElementById('horizon').onchange=render;
</script></body></html>
