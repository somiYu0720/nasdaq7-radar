<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이벤트 성격별 레이더</title><style>body{margin:0;background:#0b1220;color:#e8f0ff;font:15px system-ui}main{max-width:1100px;margin:auto;padding:18px}a{color:#8fcaff}button,select{background:#1c2b43;color:white;border:1px solid #465d7d;border-radius:9px;padding:10px;margin:4px}button.active{background:#20548b}.panel{background:#121e31;border:1px solid #293d58;border-radius:12px;padding:14px;margin:14px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:750px}th,td{padding:10px;border-bottom:1px solid #293d58;text-align:left;vertical-align:top}th{color:#a4b8d4}small{color:#a4b8d4}.tabs{display:flex;flex-wrap:wrap;gap:4px}.muted{color:#9aaccb}.tag{font-size:12px;border:1px solid #465d7d;border-radius:20px;padding:3px 7px}</style></head><body><main><a href="./index.html">← 메인 레이더</a><h1>이벤트 성격별 레이더</h1><p class="muted">NASDAQ 7.0 / 중국계 1.0 독립 · 이벤트 분류는 1차 포착 순위와 별개 · 공시 및 날짜 재검증 필요</p><div class="panel"><label>레이더 <select id="radar"><option value="all">전체(분리 표시)</option><option value="nas">NASDAQ 7.0</option><option value="china">중국계 1.0</option></select></label><label>기간 <select id="period"><option value="all">전체</option><option value="2">48시간</option><option value="7">7일</option><option value="30">30일</option></select></label><button id="refresh">새로고침</button><p id="status" class="muted">불러오는 중…</p></div><div id="tabs" class="tabs"></div><div class="panel scroll"><table><thead><tr><th>레이더</th><th>티커</th><th>성격</th><th>이벤트·설명</th><th>날짜 / D-day</th><th>상태</th><th>원문</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">날짜 없는 뉴스는 D-day 미확인으로 표시. 과거 알림은 예정 이벤트가 아닙니다. SEC 공급 A/B/C/D 및 매매 적합성은 별도 검증입니다.</p></main><script>
const BASE='https://raw.githubusercontent.com/somiYu0720/nasdaq7-radar/main/';
let all=[],selected='all',categories=[];
const $=id=>document.getElementById(id);
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function radar(e){const v=String(e.radar||e.task||'').toLowerCase();return v.includes('china')||v.includes('중국')?'china':'nas';}
function category(e){const s=[e.event_type,e.category,e.title,e.summary].join(' ').toLowerCase();if(/fda|pdufa|임상|clinical|trial|snda|bla/.test(s))return 'clinical_fda';if(/합병|인수|merger|acquisition|m&a|buyout/.test(s))return 'merger_acquisition';if(/계약|수주|공급|데이터센터|joint venture|supply contract/.test(s))return 'contract_business';if(/실적|earnings|conference|컨퍼런스|investor relations/.test(s))return 'earnings_ir';if(/자금조달|사모|pipe|financing|offering|warrant|투자 약정/.test(s))return 'financing';return 'corporate_action';}
function dateOf(e){const s=String(e.event_date||'');return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null;}
function days(s){if(!s)return null;const now=new Date();const today=Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate());return Math.round((Date.parse(s+'T00:00:00Z')-today)/86400000);}
function render(){const r=$('radar').value,p=$('period').value;const filtered=all.filter(e=>(r==='all'||e._radar===r)&&(selected==='all'||e._category===selected)&& (p==='all'||(e._days!==null&&e._days>=0&&e._days<=Number(p))));filtered.sort((a,b)=>(a._days===null?99999:a._days)-(b._days===null?99999:b._days));$('rows').innerHTML=filtered.map(e=>'<tr><td>'+safe(e._radar==='china'?'중국계 1.0':'NASDAQ 7.0')+'</td><td><b>'+safe(e.ticker)+'</b></td><td>'+safe(categories.find(c=>c.id===e._category)?.label||e._category)+'</td><td>'+safe(e.title||e.summary||e.category||'')+'</td><td>'+safe(e.event_date||'미확인')+' '+(e._days===null?'':e._days<0?'(경과)':'(D-'+e._days+')')+'</td><td><span class="tag">'+safe(e.verification||'미확인')+'</span></td><td>'+( /^https:\/\//.test(e.source_url||'')?'<a target="_blank" rel="noopener noreferrer" href="'+safe(e.source_url)+'">출처</a>':'—')+'</td></tr>').join('')||'<tr><td colspan="7">해당 조건의 기록 없음</td></tr>';$('status').textContent='기록 '+filtered.length+'건 표시 · 마지막 조회 '+new Date().toLocaleString('ko-KR');}
async function load(){try{const [c,calendar,monitor]=await Promise.all(['event_categories.json','event_calendar.json','gpt_monitor_events.json'].map(async f=>{const r=await fetch(BASE+f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(f+' '+r.status);return r.json()}));categories=c.categories||[];const seen=new Set();all=[...(calendar.events||[]),...(monitor.events||[])].filter(e=>{const k=e.id||[e.ticker,e.event_date,e.title,e.category,e.summary].join('|');if(seen.has(k))return false;seen.add(k);return true}).map(e=>({...e,_radar:radar(e),_category:category(e),_days:days(dateOf(e))}));$('tabs').innerHTML=[{id:'all',label:'전체'},...categories].map(c=>'<button data-id="'+safe(c.id)+'" class="'+(selected===c.id?'active':'')+'">'+safe(c.label)+'</button>').join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;loadTabs();render()});render()}catch(e){$('status').textContent='데이터 로딩 실패: '+e.message;}}
function loadTabs(){$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===selected));}
$('radar').onchange=render;$('period').onchange=render;$('refresh').onclick=load;load();
</script></body></html>
