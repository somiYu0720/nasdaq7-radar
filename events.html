<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이벤트 성격별 레이더</title><style>body{margin:0;background:#0b1220;color:#e8f0ff;font:15px system-ui}main{max-width:1100px;margin:auto;padding:18px}a{color:#8fcaff}button,select{background:#1c2b43;color:white;border:1px solid #465d7d;border-radius:9px;padding:10px;margin:4px}button.active{background:#20548b}.panel{background:#121e31;border:1px solid #293d58;border-radius:12px;padding:14px;margin:14px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}th,td{padding:10px;border-bottom:1px solid #293d58;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:normal}th:nth-child(1),td:nth-child(1){width:95px}th:nth-child(2),td:nth-child(2){width:70px}th:nth-child(3),td:nth-child(3){width:115px}th:nth-child(4),td:nth-child(4){width:130px}th:nth-child(5),td:nth-child(5){width:320px}th:nth-child(6),td:nth-child(6){width:110px}th:nth-child(7),td:nth-child(7){width:110px}th:nth-child(8),td:nth-child(8){width:70px}@media(max-width:650px){.scroll{overflow:visible}table{min-width:0;table-layout:auto}thead{display:none}tbody{display:grid;gap:12px}tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#18263c;border:1px solid #344a68;border-radius:12px;padding:12px}td{display:block!important;width:auto!important;padding:4px 0;border:0;min-width:0;overflow-wrap:anywhere;line-height:1.5}td:nth-child(1){color:#a4b8d4;font-size:12px}td:nth-child(2){font-size:19px}td:nth-child(3){color:#8fcaff;font-size:12px}td:nth-child(4){grid-column:1/-1;max-height:130px;overflow:auto;white-space:normal}td:nth-child(5){grid-column:1/-1;color:#ffd17b}td:nth-child(6),td:nth-child(7){font-size:12px}}th{color:#a4b8d4}small{color:#a4b8d4}.tabs{display:flex;flex-wrap:wrap;gap:4px}.muted{color:#9aaccb}.tag{font-size:12px;border:1px solid #465d7d;border-radius:20px;padding:3px 7px}</style><style>
/* Compact mobile list: all columns visible without horizontal scrolling */
@media(max-width:650px){
main{padding:10px}h1{font-size:20px;margin:8px 0}.panel{padding:9px;margin:9px 0}.tabs{gap:3px}button,select{padding:7px;font-size:12px;margin:2px}
.scroll{overflow:visible}tbody{display:block}tr{display:grid;grid-template-columns:65px 56px minmax(0,1fr) 76px;gap:4px 6px;padding:8px;margin-bottom:5px;border-radius:8px}
td{font-size:11px!important;line-height:1.35!important;padding:2px 0!important;max-height:none!important;overflow:visible!important}
td:nth-child(1){grid-column:1;grid-row:1;font-size:10px!important}
td:nth-child(2){grid-column:2;grid-row:1;font-size:14px!important}
td:nth-child(3){grid-column:3;grid-row:1;font-size:11px!important}
td:nth-child(5){grid-column:4;grid-row:1;font-size:10px!important}
td:nth-child(4){grid-column:1/-1;grid-row:2;display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden!important;font-size:12px!important}
td:nth-child(6){grid-column:1/3;grid-row:3;font-size:10px!important}
td:nth-child(7){grid-column:4;grid-row:3;text-align:right;font-size:10px!important}
}
</style><style>
*{box-sizing:border-box}
@media(max-width:650px){
main{padding:12px!important}.panel{padding:12px!important}
.scroll{overflow:visible!important}table{display:block!important;width:100%!important;min-width:0!important}thead{display:none!important}tbody{display:flex!important;flex-direction:column;gap:10px}
tbody tr{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:6px 10px!important;margin:0!important;padding:14px!important;border:1px solid #344a68!important;border-radius:13px!important;background:#18263c!important}
tbody td{display:block!important;width:auto!important;min-width:0!important;max-height:none!important;overflow:visible!important;overflow-wrap:break-word!important;word-break:keep-all!important;white-space:normal!important;font-size:13px!important;line-height:1.5!important;padding:0!important;border:0!important}
tbody td:nth-child(1){grid-column:2!important;grid-row:1!important;font-size:11px!important;text-align:right!important;color:#a4b8d4!important}
tbody td:nth-child(2){grid-column:1!important;grid-row:1!important;font-size:20px!important;font-weight:700!important}
tbody td:nth-child(3){grid-column:1/-1!important;grid-row:2!important;color:#8fcaff!important}
tbody td:nth-child(4){grid-column:1/-1!important;grid-row:3!important;display:block!important;-webkit-line-clamp:unset!important;overflow:visible!important;font-size:13px!important}
tbody td:nth-child(5){grid-column:1/-1!important;grid-row:4!important;font-size:12px!important;color:#ffd17b!important}
tbody td:nth-child(6){grid-column:1!important;grid-row:5!important}
tbody td:nth-child(7){grid-column:2!important;grid-row:5!important;text-align:right!important}
.tabs button{white-space:nowrap}
}
</style><style>.strength{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid #52647d}.strength.high{color:#75e7ad;border-color:#367c60}.strength.mid{color:#ffd17b;border-color:#8b7144}.strength.low{color:#a4b8d4}.strength.bad{color:#ff9d9d;border-color:#9d5151}.strength.unknown{color:#b5bdd0}@media(max-width:650px){tbody td:nth-child(4){grid-column:1/-1!important;grid-row:3!important;margin-bottom:2px!important}tbody td:nth-child(5){grid-column:1/-1!important;grid-row:4!important}tbody td:nth-child(6){grid-column:1/-1!important;grid-row:5!important}tbody td:nth-child(7){grid-column:1!important;grid-row:6!important}tbody td:nth-child(8){grid-column:2!important;grid-row:6!important;text-align:right!important}}</style></head><body><main><a href="./index.html">← 메인 레이더</a><h1>이벤트 성격별 레이더</h1><p class="muted">NASDAQ 7.0 / 중국계 1.0 독립 · 이벤트 분류는 1차 포착 순위와 별개 · 공시 및 날짜 재검증 필요</p><div class="panel"><label>레이더 <select id="radar"><option value="all">전체(분리 표시)</option><option value="nas">NASDAQ 7.0</option><option value="china">중국계 1.0</option></select></label><label>기간 <select id="period"><option value="all">전체</option><option value="2">48시간</option><option value="7">7일</option><option value="30">30일</option></select></label><button id="refresh">새로고침</button><p id="status" class="muted">불러오는 중…</p></div><div id="tabs" class="tabs"></div><div class="panel scroll"><table><thead><tr><th>레이더</th><th>티커</th><th>성격</th><th>호재 강도</th><th>이벤트·설명</th><th>날짜 / D-day</th><th>상태</th><th>원문</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">날짜 없는 뉴스는 D-day 미확인으로 표시. 과거 알림은 예정 이벤트가 아닙니다. SEC 공급 A/B/C/D 및 매매 적합성은 별도 검증입니다.</p></main><script>
const BASE='https://raw.githubusercontent.com/somiYu0720/nasdaq7-radar/main/';
let all=[],selected='all',categories=[];
const $=id=>document.getElementById(id);
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function radar(e){const v=String(e.radar||e.task||'').toLowerCase();return v.includes('china')||v.includes('중국')?'china':'nas';}
function category(e){const s=[e.event_type,e.category,e.title,e.summary].join(' ').toLowerCase();if(/fda|pdufa|임상|clinical|trial|snda|bla/.test(s))return 'clinical_fda';if(/합병|인수|merger|acquisition|m&a|buyout/.test(s))return 'merger_acquisition';if(/계약|수주|공급|데이터센터|joint venture|supply contract/.test(s))return 'contract_business';if(/실적|earnings|conference|컨퍼런스|investor relations/.test(s))return 'earnings_ir';if(/자금조달|사모|pipe|financing|offering|warrant|투자 약정/.test(s))return 'financing';return 'corporate_action';}
function strength(e){
const explicit=String(e.event_strength||'').toUpperCase();
if(['HIGH','STRONG','강','강력'].includes(explicit))return {label:'강 · 명시',cls:'high'};
if(['MEDIUM','MID','중'].includes(explicit))return {label:'중 · 명시',cls:'mid'};
if(['LOW','WEAK','약'].includes(explicit))return {label:'약 · 명시',cls:'low'};
const v=String([e.title,e.summary,e.category,e.event_type].filter(Boolean).join(' ')).toLowerCase();
if(!v)return {label:'미평가',cls:'unknown'};
if(/임상 중단|개발 중단|상장폐지|파산|회계 재작성|restatement|clinical hold|trial failure|liquidation|bankruptcy/.test(v))return {label:'악재 신호',cls:'bad'};
if(/검토|예정|계획|의향서|loi|proposal|anticipated|planned|considering/.test(v)&& !/종결 완료|계약 체결 완료|closing completed/.test(v))return {label:'조건부 · 추정',cls:'mid'};
if(/fda 승인|pdufa approval|phase 3.*성공|임상 3상.*성공|인수 완료|합병 완료|종결 완료|확정 수주|definitive merger|binding agreement|대규모.*확정 계약/.test(v))return {label:'강 · 추정',cls:'high'};
if(/임상|fda|인수|합병|계약|수주|실적|매출|투자|증자|배당|financing|earnings|merger|acquisition/.test(v))return {label:'중 · 추정',cls:'mid'};
return {label:'미평가',cls:'unknown'};
}
function dateOf(e){const s=String(e.event_date||'');return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null;}
function days(s){if(!s)return null;const now=new Date();const kst=new Date(now.getTime()+9*3600000);const today=Date.UTC(kst.getUTCFullYear(),kst.getUTCMonth(),kst.getUTCDate());return Math.round((Date.parse(s+'T00:00:00Z')-today)/86400000);}
function render(){const r=$('radar').value,p=$('period').value;const filtered=all.filter(e=>(r==='all'||e._radar===r)&&(selected==='all'||e._category===selected)&& (p==='all'||(e._days!==null&&e._days>=0&&e._days<=Number(p))));filtered.sort((a,b)=>(a._days===null?99999:a._days)-(b._days===null?99999:b._days));$('rows').innerHTML=filtered.map(e=>'<tr><td>'+safe(e._radar==='china'?'중국계 1.0':'NASDAQ 7.0')+'</td><td><b>'+safe(e.ticker)+'</b></td><td>'+safe(categories.find(c=>c.id===e._category)?.label||e._category)+'</td><td><span class="strength '+strength(e).cls+'">'+safe(strength(e).label)+'</span></td><td>'+safe(e.title||e.summary||e.category||'')+'</td><td>'+safe(e.event_date||'미확인')+' '+(e._days===null?'':e._days<0?'(경과)':'(D-'+e._days+')')+'</td><td><span class="tag">'+safe(e.verification||'미확인')+'</span></td><td>'+( /^https:\/\//.test(e.source_url||'')?'<a target="_blank" rel="noopener noreferrer" href="'+safe(e.source_url)+'">출처</a>':'—')+'</td></tr>').join('')||'<tr><td colspan="8">해당 조건의 기록 없음</td></tr>';$('status').textContent='전체 '+all.length+'건 · 현재 필터 '+filtered.length+'건 · 마지막 조회 '+new Date().toLocaleString('ko-KR');}
async function load(){try{const [c,calendar,monitor]=await Promise.all(['event_categories.json','event_calendar.json','gpt_monitor_events.json'].map(async f=>{const r=await fetch(BASE+f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(f+' '+r.status);return r.json()}));categories=c.categories||[];const seen=new Set();all=[...(calendar.events||[]),...(monitor.events||[])].filter(e=>{const k=e.id?('id:'+e.id):('fallback:'+ [e.radar||e.task,e.ticker,e.event_date,e.title,e.category,e.summary].join('|'));if(seen.has(k))return false;seen.add(k);return true}).map(e=>({...e,_radar:radar(e),_category:category(e),_days:days(dateOf(e))}));$('tabs').innerHTML=[{id:'all',label:'전체'},...categories].map(c=>'<button data-id="'+safe(c.id)+'" class="'+(selected===c.id?'active':'')+'">'+safe(c.label)+'</button>').join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;loadTabs();render()});render();$('status').textContent+=' · 달력 '+(calendar.events||[]).length+'건 / GPT 기록 '+(monitor.events||[]).length+'건 (중복 제거)'}catch(e){$('status').textContent='데이터 로딩 실패: '+e.message;}}
function loadTabs(){$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===selected));}
$('radar').onchange=render;$('period').onchange=render;$('refresh').onclick=load;load();
</script></body></html>
