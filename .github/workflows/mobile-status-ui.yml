name: Isolated mobile status layout regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/test_mobile_status_ui.py'
      - '.github/workflows/mobile-status-ui.yml'
  workflow_dispatch:
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check 320-430px status layout
        run: python -m unittest discover -s tests -p 'test_mobile_status_ui.py' -v
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-status-screenshots
          path: mobile-status-*.png
          if-no-files-found: ignore
