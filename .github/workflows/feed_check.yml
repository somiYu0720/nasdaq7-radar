name: NASDAQ7 feed connectivity check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Yahoo 1-minute data
        run: python check_market_feed.py
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq7-feed-check
          path: nasdaq7_feed_check.json
          if-no-files-found: warn
