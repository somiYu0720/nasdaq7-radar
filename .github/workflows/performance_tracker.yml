name: Performance tracker (independent)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: performance-tracker
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Track observations
        run: python performance_tracker.py
      - name: Commit performance data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add performance_results.json
          if ! git diff --cached --quiet; then
            git commit -m "Track independent radar performance observations"
            git pull --rebase
            git push
          fi
