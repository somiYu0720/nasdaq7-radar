name: SEC filing metadata refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12,19 * * 1-5'
permissions:
  contents: write
concurrency:
  group: radar-sec
  cancel-in-progress: false
jobs:
  sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official SEC submissions
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sec_events_refresh.py
      - name: Categorize filing forms conservatively
        run: python sec_event_triage.py
      - name: Commit SEC snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sec_events.json
          git diff --cached --quiet || (git commit -m 'Update SEC filing index' && git pull --rebase && git push)
