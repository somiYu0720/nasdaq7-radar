name: Daily radar refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run collector
        run: python collector.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V62_RESULT.html V62_RESULT.csv
          git diff --cached --quiet || (git commit -m "Update radar" && git push)
