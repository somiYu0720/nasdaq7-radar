name: Archive Toss radar snapshots
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toss-history-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append latest snapshot
        run: python scripts/append_toss_history.py
      - name: Commit archive if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toss_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Toss radar snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
