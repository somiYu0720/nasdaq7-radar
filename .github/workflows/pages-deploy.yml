name: Deploy radar website to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'watchlist.json'
      - 'data.json'
      - 'toss_live.json'
      - 'radar_bridge.json'
      - '.github/workflows/pages-deploy.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
