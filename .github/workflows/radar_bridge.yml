name: Radar bridge
on:
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * 1-5'
permissions:
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build bridge
        run: python radar_bridge.py
      - name: Save bridge
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add radar_bridge.json
          git diff --cached --quiet || (git commit -m 'Update radar bridge' && git push)