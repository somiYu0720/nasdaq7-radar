name: Scheduled minute feed diagnostic
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 13-21 * * 1-5'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check minute data provider
        run: python check_market_feed.py
      - name: Save diagnostic report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nasdaq7_feed_check.json
          git diff --cached --quiet || (git commit -m 'Update feed diagnostic' && git push)