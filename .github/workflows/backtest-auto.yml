name: Research Backtest (isolated)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: research-backtest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute research-only backtest
        run: python experiments/auto_backtest.py
      - name: Publish research results only
        run: |
          if ! git diff --quiet -- backtest_results.json || [ -n "$(git ls-files --others --exclude-standard backtest_results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backtest_results.json
            git commit -m "Update isolated backtest research status"
            git push
          fi
