name: SEC filing evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan SEC filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python sec_dilution_evidence.py
      - name: Save evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sec_dilution_evidence.json
          git diff --cached --quiet || (git commit -m "Refresh SEC evidence" && git push)
