name: Watchlist five-minute refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'toss_live.json'
  schedule:
    - cron: '*/10 12-23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: radar-watchlist
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh cached five-minute watchlist
        run: python refresh_watchlist_5m.py
      - name: Save shared last regular-session TOP10
        run: python scripts/save_last_close_top10.py
      - name: Build radar lanes
        run: python radar_bridge.py
      - name: Archive new radar signals
        run: python record_alert_history.py
      - name: Save signals
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.json radar_bridge.json minute_feed_status.json alert_history.json last_close_top10.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh watchlist radar signals'
            git pull --rebase origin main
            git push origin HEAD:main
          fi