<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NASDAQ 7.0 / 중국계 1.0 조기포착 점수</title><style>body{background:#0b1020;color:#e9f3ff;font:14px system-ui;margin:18px}h1{font-size:22px}h2{color:#64d9ff}small{color:#9baec8}table{width:100%;border-collapse:collapse;margin-bottom:25px}td,th{padding:9px 5px;border-bottom:1px solid #283449;text-align:left}th{color:#99bddb}.num{text-align:right;font-variant-numeric:tabular-nums}.warn{color:#ffcf7a}.good{color:#6ee7b7}.note{line-height:1.6;background:#17233a;padding:12px;border-radius:9px}a{color:#76dfff}</style><h1>📡 조기포착 TOP 10 · 수급 잠정점수</h1><div class="note" id="status">데이터 불러오는 중</div><section id="tables"></section><p><small>주의: 본 화면은 SEC 희석 위험으로 1차 순위를 감점하지 않습니다. RVOL 기준선이 없으면 RVOL을 표시하지 않습니다. 투자 권유 아님.</small></p><p><a href="./index.html">← 기존 포착기로 돌아가기</a></p><script>
const $=id=>document.getElementById(id);
const get=async f=>{const r=await fetch('./'+f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(f+' '+r.status);return r.json()};
function rows(d,h,key){const latest=(h.snapshots||[]).slice(-180),previous=latest.length>1?latest[latest.length-2]:null;const now=(d[key]||[]).filter(x=>x.ticker&&Number.isFinite(+x.minute_volume)&&+x.minute_volume>=0);const max=Math.max(1,...now.map(x=>+x.minute_volume));return now.map(x=>{const low=+x.low,high=+x.high,close=+x.close;const position=Number.isFinite(low)&&Number.isFinite(high)&&high>low?Math.max(0,Math.min(1,(close-low)/(high-low))):null;const volume=Math.round(25*Math.log1p(+x.minute_volume)/Math.log1p(max));const candle=position===null?10:Math.round(position*20);const prev=(previous?.[key]||[]).find(y=>y.ticker===x.ticker);const delta=prev&&+prev.minute_volume>0?+x.minute_volume/(+prev.minute_volume):null;const q=Date.parse(x.quote_time),updated=Date.parse(d.updated_utc);const stale=!Number.isFinite(q)||!Number.isFinite(updated)||updated-q>5*60000;return {...x,score:volume+candle,delta,stale};}).sort((a,b)=>b.score-a.score||b.minute_volume-a.minute_volume).slice(0,10)}
function render(d,h,sec){const count=(h.snapshots||[]).length;const enough=count>=2;const checked=sec.checked_utc||'없음';$('status').innerHTML='토스 갱신: '+new Date(d.updated_utc).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' · 누적 스냅샷 '+count+'개 · SEC 증거파일 '+checked+'<br><span class="warn">임시 45점: 분봉 거래량 25점 + 봉 마감 위치 20점. 정식 100점/RVOL/OBV는 계산 불가. 연속 스냅샷 배율은 RVOL이 아닙니다.</span>'; $('tables').innerHTML=['nasdaq7','china1'].map((key)=>'<h2>'+(key==='nasdaq7'?'NASDAQ 7.0':'중국계 1.0')+'</h2><table><thead><tr><th>#</th><th>티커</th><th class="num">USD</th><th class="num">분봉량</th><th class="num">임시 /45</th><th class="num">직전 수집 대비</th><th>SEC</th></tr></thead><tbody>'+rows(d,h,key).map((x,i)=>{const s=sec.tickers?.[x.ticker];const state=s?.supply_review_candidate?'검토 '+s.supply_review_candidate:s?.status==='EVIDENCE_FOUND'?'증거 발견':s?.status==='SEC_SUBMISSIONS_FETCHED'?'제출자료 확인':'미검증';const ratio=enough&&x.delta!==null?x.delta.toFixed(2)+'×':'—';return '<tr><td>'+(i+1)+'</td><td><b>'+x.ticker+'</b>'+(x.stale?' <span class="warn">지연</span>':'')+'</td><td class="num">'+Number(x.price_usd).toFixed(4)+'</td><td class="num">'+Number(x.minute_volume).toLocaleString()+'</td><td class="num good">'+x.score+'</td><td class="num">'+ratio+'</td><td>'+state+'</td></tr>'}).join('')+'</tbody></table>').join('')}
async function load(){try{const [d,h,s]=await Promise.all([get('toss_live.json'),get('toss_history.json'),get('sec_dilution_evidence.json')]);render(d,h,s)}catch(e){$('status').textContent='데이터 연결 확인 필요: '+e.message}}load();setInterval(load,60000);
</script></html>
