<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자동 백테스트 검증 현황</title><style>body{font-family:system-ui;background:#0b1220;color:#e7edf8;margin:0;padding:22px}main{max-width:750px;margin:auto}article{background:#182439;border:1px solid #34435a;border-radius:14px;padding:18px;margin:12px 0}.muted{color:#aabbd1}strong{font-size:1.5rem}a{color:#80bfff}td{padding:9px;border-bottom:1px solid #34435a}table{width:100%;border-collapse:collapse}</style></head><body><main><h1>과거 급등 자동 백테스트</h1><p class="muted">기존 NASDAQ 7.0 점수와 독립된 연구용 결과입니다. 점수 미산출은 오류가 아닙니다.</p><article><div class="muted">검증 상태</div><strong id="status">불러오는 중</strong><p id="updated" class="muted"></p></article><article><h2>후속 성과 검증</h2><table><thead><tr><td>구간</td><td>표본</td><td>상승 비율</td><td>평균 수익률</td></tr></thead><tbody id="rows"></tbody></table></article><p class="muted">실제 관측된 연속 1분봉과 최소 30건의 후속 성과가 확보될 때까지 적중률은 표시하지 않습니다. 본 데이터는 투자 성과를 보장하지 않습니다.</p><a href="./">기존 포착기로 돌아가기</a></main><script>async function load(){try{const r=await fetch('./backtest_results.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('결과 파일 없음');const d=await r.json();document.getElementById('status').textContent=d.status==='RESEARCH_RESULTS_NOT_VALIDATED'?'표본 검증 대기':d.status==='WAITING_FOR_HISTORICAL_MINUTE_BARS'?'과거 분봉 누적 대기':d.status==='BACKTEST_ERROR'?'백테스트 실행 오류':'검증 상태 확인 필요';document.getElementById('updated').textContent='마지막 결과: '+(d.updated_at||'미확인')+' / 포착 신호: '+(d.signal_count??'미확인')+'건';document.getElementById('rows').innerHTML=[['30','30분'],['390','390분'],['1170','1170분'],['1950','1950분']].map(([k,label])=>{const v=d.summary?.[k]||{};return '<tr><td>'+label+'</td><td>'+(v.sample_count??0)+'</td><td>'+(v.win_rate==null?'검증 대기':(v.win_rate*100).toFixed(1)+'%')+'</td><td>'+(v.mean_return_pct==null?'검증 대기':v.mean_return_pct+'%')+'</td></tr>'}).join('')}catch(e){document.getElementById('status').textContent='결과 확인 불가';document.getElementById('updated').textContent=String(e)}}load();setInterval(load,60000)</script></body></html>
